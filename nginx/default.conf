server {
    # Escucha en el puerto 80 interno del contenedor NGINX
    listen 80;
    server_name _;

    # Ruta raíz compartida donde se encuentran los archivos de WordPress
    root /var/www/html;
    index index.php;
    client_max_body_size 64M;

    # Procesa peticiones y redirige a index.php si no existe el fichero directo
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Procesa ficheros PHP mediante FastCGI pasándolos al contenedor wordpress
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
